InlayHints:
  BlockEnd: true
CompileFlags:
  Add: [-Wall, -Werror]
# clang-tidy checks come from .clang-tidy files: ~/.clang-tidy by default, or the project's own.
# Checks added here would override every project's choice, so none are.
---

If:                               # Apply this config conditionally
  PathMatch: [.*\.cpp, .*\.cc, .*\.cxx, .*\.hh, .*\.hpp, .*\.hxx]
CompileFlags:
  Add: [-xc++]   # no -std here: it would override every project's own standard
