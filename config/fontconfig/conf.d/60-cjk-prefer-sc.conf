<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- With LANG=en_US, generic families fall back to Noto Sans CJK KR for Han
     characters (Korean glyph shapes). Put the Simplified Chinese faces right
     after the Latin font so Chinese text uses SC glyphs everywhere. -->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Noto Sans</family><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Noto Serif</family><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family><family>Noto Sans CJK SC</family></prefer>
  </alias>
</fontconfig>
