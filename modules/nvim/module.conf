description Neovim 0.12 config (vim.pack plugins, treesitter, built-in LSP)
tool nvim min=0.12 zypper=neovim apt=neovim
tool rg optional zypper=ripgrep apt=ripgrep
# Parsers: tree-sitter CLI + C compiler; 0.25.10 was tested with all configured parsers.
tool tree-sitter optional min=0.25 zypper=tree-sitter apt=tree-sitter-cli
tool cc optional zypper=gcc apt=gcc
tool git optional zypper=git apt=git
